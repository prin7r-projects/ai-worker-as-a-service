services:
  # --- Postgres for Shiftledger app (Phase 1+) ---
  postgres:
    image: postgres:16-alpine
    container_name: shiftledger-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: shiftledger
      POSTGRES_PASSWORD: shiftledger
      POSTGRES_DB: shiftledger
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shiftledger -d shiftledger"]
      interval: 5s
      timeout: 3s
      retries: 5

  # --- Redis for BullMQ queues (Phase 1+) ---
  redis:
    image: redis:7-alpine
    container_name: shiftledger-redis
    restart: unless-stopped
    expose:
      - "6379"
    volumes:
      - redisdata:/data

  # --- App server (Express: /app UI + /api backend) ---
  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    image: shiftledger-app:latest
    container_name: shiftledger-app
    restart: unless-stopped
    expose:
      - "3001"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgres://shiftledger:shiftledger@postgres:5432/shiftledger
      - REDIS_URL=redis://redis:6379
      - DASHBOARD_URL=https://ai-worker-as-a-service.prin7r.com/app
      - APP_SERVER_URL=http://app:3001
      - PORT=3001
      - HOSTNAME=0.0.0.0
      - NODE_ENV=production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    labels:
      - "traefik.enable=true"
      # /api/admin/* — rate-limited admin endpoints (priority 12, more specific than /api)
      - "traefik.http.routers.shiftledger-admin.rule=Host(`ai-worker-as-a-service.prin7r.com`) && PathPrefix(`/api/admin`)"
      - "traefik.http.routers.shiftledger-admin.entrypoints=websecure"
      - "traefik.http.routers.shiftledger-admin.tls=true"
      - "traefik.http.routers.shiftledger-admin.priority=12"
      - "traefik.http.routers.shiftledger-admin.middlewares=shiftledger-admin-ratelimit"
      - "traefik.http.routers.shiftledger-admin.service=shiftledger-admin"
      - "traefik.http.services.shiftledger-admin.loadbalancer.server.port=3001"
      # Admin rate limit: 10 req/min/IP, burst 3
      - "traefik.http.middlewares.shiftledger-admin-ratelimit.ratelimit.average=10"
      - "traefik.http.middlewares.shiftledger-admin-ratelimit.ratelimit.period=1m"
      - "traefik.http.middlewares.shiftledger-admin-ratelimit.ratelimit.burst=3"
      # /api/* — all other API routes (priority 10)
      - "traefik.http.routers.shiftledger-api.rule=Host(`ai-worker-as-a-service.prin7r.com`) && PathPrefix(`/api`)"
      - "traefik.http.routers.shiftledger-api.entrypoints=websecure"
      - "traefik.http.routers.shiftledger-api.tls=true"
      - "traefik.http.routers.shiftledger-api.priority=10"
      - "traefik.http.routers.shiftledger-api.service=shiftledger-api"
      - "traefik.http.services.shiftledger-api.loadbalancer.server.port=3001"
      # /app/* — dashboard UI (priority 10)
      - "traefik.http.routers.shiftledger-app-ui.rule=Host(`ai-worker-as-a-service.prin7r.com`) && PathPrefix(`/app`)"
      - "traefik.http.routers.shiftledger-app-ui.entrypoints=websecure"
      - "traefik.http.routers.shiftledger-app-ui.tls=true"
      - "traefik.http.routers.shiftledger-app-ui.priority=10"
      - "traefik.http.routers.shiftledger-app-ui.service=shiftledger-app-ui"
      - "traefik.http.services.shiftledger-app-ui.loadbalancer.server.port=3001"

  # --- Landing (Next.js: marketing site + checkout/webhook routes) ---
  landing:
    build:
      context: .
      dockerfile: Dockerfile.landing
    image: shiftledger-landing:latest
    container_name: shiftledger-landing
    restart: unless-stopped
    expose:
      - "3000"
    env_file:
      - .env
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NODE_ENV=production
      - DATABASE_URL=postgres://shiftledger:shiftledger@postgres:5432/shiftledger
      - APP_SERVER_URL=http://app:3001
    labels:
      - "traefik.enable=true"
      # /api/checkout/* — rate-limited checkout (priority 15, most specific)
      - "traefik.http.routers.shiftledger-checkout.rule=Host(`ai-worker-as-a-service.prin7r.com`) && PathPrefix(`/api/checkout`)"
      - "traefik.http.routers.shiftledger-checkout.entrypoints=websecure"
      - "traefik.http.routers.shiftledger-checkout.tls=true"
      - "traefik.http.routers.shiftledger-checkout.priority=15"
      - "traefik.http.routers.shiftledger-checkout.middlewares=shiftledger-checkout-ratelimit"
      - "traefik.http.routers.shiftledger-checkout.service=shiftledger-checkout"
      - "traefik.http.services.shiftledger-checkout.loadbalancer.server.port=3000"
      # Checkout rate limit: 30 req/min/IP, burst 5
      - "traefik.http.middlewares.shiftledger-checkout-ratelimit.ratelimit.average=30"
      - "traefik.http.middlewares.shiftledger-checkout-ratelimit.ratelimit.period=1m"
      - "traefik.http.middlewares.shiftledger-checkout-ratelimit.ratelimit.burst=5"
      # /api/webhooks/* — rate-limited webhooks (priority 15)
      - "traefik.http.routers.shiftledger-webhooks.rule=Host(`ai-worker-as-a-service.prin7r.com`) && PathPrefix(`/api/webhooks`)"
      - "traefik.http.routers.shiftledger-webhooks.entrypoints=websecure"
      - "traefik.http.routers.shiftledger-webhooks.tls=true"
      - "traefik.http.routers.shiftledger-webhooks.priority=15"
      - "traefik.http.routers.shiftledger-webhooks.middlewares=shiftledger-webhook-ratelimit"
      - "traefik.http.routers.shiftledger-webhooks.service=shiftledger-webhooks"
      - "traefik.http.services.shiftledger-webhooks.loadbalancer.server.port=3000"
      # Webhook rate limit: 600 req/min total, burst 100
      - "traefik.http.middlewares.shiftledger-webhook-ratelimit.ratelimit.average=600"
      - "traefik.http.middlewares.shiftledger-webhook-ratelimit.ratelimit.period=1m"
      - "traefik.http.middlewares.shiftledger-webhook-ratelimit.ratelimit.burst=100"
      # Catch-all: everything else on the domain (priority 1)
      - "traefik.http.routers.shiftledger-landing.rule=Host(`ai-worker-as-a-service.prin7r.com`)"
      - "traefik.http.routers.shiftledger-landing.entrypoints=websecure"
      - "traefik.http.routers.shiftledger-landing.tls=true"
      - "traefik.http.routers.shiftledger-landing.priority=1"
      - "traefik.http.routers.shiftledger-landing.service=shiftledger-landing"
      - "traefik.http.services.shiftledger-landing.loadbalancer.server.port=3000"

volumes:
  pgdata:
  redisdata:
