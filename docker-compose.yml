services:
  # --- Postgres for Shiftledger app (Phase 1+) ---
  postgres:
    image: postgres:16-alpine
    container_name: shiftledger-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: shiftledger
      POSTGRES_PASSWORD: shiftledger
      POSTGRES_DB: shiftledger
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - shiftledger

  # --- Redis for BullMQ queues (Phase 1+) ---
  redis:
    image: redis:7-alpine
    container_name: shiftledger-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - shiftledger

  # --- App server (Phase 3) ---
  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    image: shiftledger-app:latest
    container_name: shiftledger-app
    restart: unless-stopped
    expose:
      - "3001"
    environment:
      - DATABASE_URL=postgres://shiftledger:shiftledger@postgres:5432/shiftledger
      - REDIS_URL=redis://redis:6379
      - INTEGRATION_KEY=${INTEGRATION_KEY:-}
      - ADMIN_API_KEY=${ADMIN_API_KEY:-}
      - NOTION_TOKEN=${NOTION_TOKEN:-}
      - POSTMARK_API_KEY=${POSTMARK_API_KEY:-}
      - POSTMARK_FROM_EMAIL=${POSTMARK_FROM_EMAIL:-desk@ai-worker-as-a-service.prin7r.com}
      - POSTMARK_TEMPLATE_ALIAS=${POSTMARK_TEMPLATE_ALIAS:-}
      - ZENDESK_SUBDOMAIN=${ZENDESK_SUBDOMAIN:-}
      - SALESFORCE_INSTANCE_URL=${SALESFORCE_INSTANCE_URL:-}
      - DASHBOARD_URL=${DASHBOARD_URL:-https://ai-worker-as-a-service.prin7r.com/app}
      - APP_SERVER_URL=http://app:3001
      - NOTION_CONTRACTS_DSID=${NOTION_CONTRACTS_DSID:-}
      # Phase 4: Observability (PRI-2323)
      - SLACK_ALERT_WEBHOOK_URL=${SLACK_ALERT_WEBHOOK_URL:-}
      - START_HEARTBEAT=${START_HEARTBEAT:-true}
      # Phase 5: Cron jobs (PRI-2322)
      - START_CRON_JOBS=${START_CRON_JOBS:-true}
    depends_on:
      - postgres
      - redis
    networks:
      - shiftledger
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.shiftledger-app.rule=Host(`ai-worker-as-a-service.prin7r.com`) && PathPrefix(`/api/internal`)"
      - "traefik.http.routers.shiftledger-app.entrypoints=websecure"
      - "traefik.http.routers.shiftledger-app.tls.certresolver=letsencrypt"
      - "traefik.http.services.shiftledger-app.loadbalancer.server.port=3001"
      # Phase 4: Rate limit /api/admin/* at 10 req/min/IP (Traefik middleware)
      - "traefik.http.routers.shiftledger-app-admin.rule=Host(`ai-worker-as-a-service.prin7r.com`) && PathPrefix(`/api/admin`)"
      - "traefik.http.routers.shiftledger-app-admin.entrypoints=websecure"
      - "traefik.http.routers.shiftledger-app-admin.tls.certresolver=letsencrypt"
      - "traefik.http.routers.shiftledger-app-admin.middlewares=shiftledger-admin-ratelimit"
      - "traefik.http.middlewares.shiftledger-admin-ratelimit.ratelimit.average=10"
      - "traefik.http.middlewares.shiftledger-admin-ratelimit.ratelimit.period=1m"
      - "traefik.http.middlewares.shiftledger-admin-ratelimit.ratelimit.burst=3"

  landing:
    build:
      context: .
      dockerfile: Dockerfile.landing
    image: shiftledger-landing:latest
    container_name: shiftledger-landing
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NOWPAYMENTS_API_KEY=${NOWPAYMENTS_API_KEY:-}
      - NOWPAYMENTS_IPN_SECRET=${NOWPAYMENTS_IPN_SECRET:-}
      - NOWPAYMENTS_SANDBOX=${NOWPAYMENTS_SANDBOX:-false}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-https://ai-worker-as-a-service.prin7r.com}
      - DATABASE_URL=postgres://shiftledger:shiftledger@144.91.94.91:5433/shiftledger
      - APP_SERVER_URL=http://144.91.94.91:3001
      - NOTION_TOKEN=${NOTION_TOKEN:-}
      # Phase 4: Slack alerts for webhook sig failures (PRI-2323 task 5)
      - SLACK_ALERT_WEBHOOK_URL=${SLACK_ALERT_WEBHOOK_URL:-}
    env_file:
      - .env
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ai-worker-as-a-service.rule=Host(`ai-worker-as-a-service.prin7r.com`)"
      - "traefik.http.routers.ai-worker-as-a-service.entrypoints=websecure"
      - "traefik.http.routers.ai-worker-as-a-service.tls.certresolver=letsencrypt"
      - "traefik.http.services.ai-worker-as-a-service.loadbalancer.server.port=3000"
      # Phase 4: Rate limits per docs/12 §7
      # /api/checkout/*  30 req/min/IP
      - "traefik.http.routers.shiftledger-checkout.rule=Host(`ai-worker-as-a-service.prin7r.com`) && PathPrefix(`/api/checkout`)"
      - "traefik.http.routers.shiftledger-checkout.entrypoints=websecure"
      - "traefik.http.routers.shiftledger-checkout.tls.certresolver=letsencrypt"
      - "traefik.http.routers.shiftledger-checkout.middlewares=shiftledger-checkout-ratelimit"
      - "traefik.http.middlewares.shiftledger-checkout-ratelimit.ratelimit.average=30"
      - "traefik.http.middlewares.shiftledger-checkout-ratelimit.ratelimit.period=1m"
      - "traefik.http.middlewares.shiftledger-checkout-ratelimit.ratelimit.burst=5"
      # /api/webhooks/*  600 req/min total (not per-IP)
      - "traefik.http.routers.shiftledger-webhooks.rule=Host(`ai-worker-as-a-service.prin7r.com`) && PathPrefix(`/api/webhooks`)"
      - "traefik.http.routers.shiftledger-webhooks.entrypoints=websecure"
      - "traefik.http.routers.shiftledger-webhooks.tls.certresolver=letsencrypt"
      - "traefik.http.routers.shiftledger-webhooks.middlewares=shiftledger-webhook-ratelimit"
      - "traefik.http.middlewares.shiftledger-webhook-ratelimit.ratelimit.average=600"
      - "traefik.http.middlewares.shiftledger-webhook-ratelimit.ratelimit.period=1m"
      - "traefik.http.middlewares.shiftledger-webhook-ratelimit.ratelimit.burst=100"
    networks:
      - shiftledger

volumes:
  pgdata:
  redisdata:

networks:
  shiftledger:
    driver: bridge
